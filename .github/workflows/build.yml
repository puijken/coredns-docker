name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Builds are otherwise on-demand. This monthly run matters most in this repo: both base images
  # are floating tags (`coredns/coredns:latest` and `python:3.14-slim`), and Dependabot cannot
  # track `latest` at all, so without this nothing would ever trigger a rebuild for an upstream
  # security fix. No `no-cache` is needed -- there is no layer cache configured and `pull: true`
  # below re-resolves the tags against the registry, so every build is already fully fresh.
  schedule:
    - cron: '0 1 1 * *'  # 01:00 UTC on the 1st of each month

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          tags: ghcr.io/${{ github.repository }}:latest