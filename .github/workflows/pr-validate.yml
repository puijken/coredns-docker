name: Validate PR Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Runs before the build: a records regression is invisible to `docker build`, which
      # succeeds just as happily while update_hosts.py publishes the wrong addresses.
      - name: Run smoke test
        run: python3 smoke_test.py

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
